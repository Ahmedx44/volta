name: volta
description: Battery monitor.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  material_ui:
  jni: ^1.1.2
  jni_flutter: ^1.0.4
  google_fonts: ^6.0.0
  hugeicons: ^4.4.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6
  permission_handler: ^13.0.2
  smooth_page_indicator: ^3.0.0
  flutter_svg: ^2.5.0
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^23.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  jnigen: ^1.0.1
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/volta_icon.png"
  adaptive_icon_background: "#64D585"
  adaptive_icon_foreground: "assets/icon/volta_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/volta_icon_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/